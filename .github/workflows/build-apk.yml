name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Arrange project layout
        run: |
          set -e
          mkdir -p gradle app/src/main/java
          mkdir -p app/src/main/res/{values,xml,font,drawable,mipmap-anydpi-v26}
          mv libs.versions.toml gradle/
          mv AndroidManifest.xml app/src/main/
          mv proguard-rules.pro app/
          mv colors.xml strings.xml themes.xml app/src/main/res/values/
          if [ -f firebase_applet_config.xml ]; then mv firebase_applet_config.xml app/src/main/res/values/; fi
          mv backup_rules.xml data_extraction_rules.xml file_paths.xml app/src/main/res/xml/
          mv *.ttf app/src/main/res/font/
          mv ic_launcher_background.xml ic_launcher_foreground.xml app/src/main/res/drawable/
          mv ic_launcher.xml ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/
          rm -f Example*Test.kt StudioRepositoryRuleTest.kt FirestoreEmulatorTestBase.kt
          mv *.kt app/src/main/java/
          mv build.gradle.kts app/build.gradle.kts
          echo "// root build file" > build.gradle.kts
          grep -q 'include(":app")' settings.gradle.kts || echo 'include(":app")' >> settings.gradle.kts

      - name: Create missing pieces
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          if ! grep -rqs 'name="default_web_client_id"' app/src/main/res; then
            echo '<resources><string name="default_web_client_id">placeholder</string></resources>' > app/src/main/res/values/ph_web_client.xml
          fi
          if ! grep -rqs 'name="firestore_database_id"' app/src/main/res; then
            echo '<resources><string name="firestore_database_id">(default)</string></resources>' > app/src/main/res/values/ph_firestore.xml
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
